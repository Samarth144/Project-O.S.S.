services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PORT: 3000
      DATA_DIR: /app-data
      LOG_FILE: /app-data/project_oss.log
      POLICY_FILE: /app-data/policy.json
      CHROMA_DB_DIR: /app-data/chroma_db
      HF_HOME: /app-data/huggingface
      PYTHON_BIN: /opt/ai-venv/bin/python
      INTERNAL_API_URL: http://api:3000
      WATCHDOG_URL: http://watchdog:3100
      N8N_OBSERVER_WEBHOOK: ${N8N_OBSERVER_WEBHOOK:-http://host.docker.internal:5678/webhook/Observer}
      N8N_SCRIBE_WEBHOOK: ${N8N_SCRIBE_WEBHOOK:-http://host.docker.internal:5678/webhook/Scribe}
      N8N_SHIELD_WEBHOOK: ${N8N_SHIELD_WEBHOOK:-http://host.docker.internal:5678/webhook/Shield}
      N8N_COMMANDER_WEBHOOK: ${N8N_COMMANDER_WEBHOOK:-http://host.docker.internal:5678/webhook/Commander}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-data:/app-data
    expose:
      - "3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./Nexa-bank
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /backend
    expose:
      - "4173"
    restart: unless-stopped

  watchdog:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "telemetry-watchdog.js"]
    environment:
      APP_URL: http://api:3000
      OBSERVER_WEBHOOK: ${N8N_OBSERVER_WEBHOOK:-http://host.docker.internal:5678/webhook/Observer}
      LOG_PATH: /app-data/project_oss.log
      DEAD_LETTER_PATH: /app-data/watchdog-dead-letters.jsonl
      WATCHDOG_PORT: 3100
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-data:/app-data
    expose:
      - "3100"
    depends_on:
      - api
    restart: unless-stopped

  web:
    image: nginx:stable-alpine
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

volumes:
  app-data:
